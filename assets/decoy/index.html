<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<title>Загрузка…</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%235b6c8f' stroke-width='4' stroke-dasharray='20 62'/%3E%3C/svg%3E">
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #1b2331 0%, #0d1117 55%, #090c10 100%);
    color: #c9d1d9;
  }
  .card {
    width: min(92vw, 420px);
    padding: 40px 34px 34px;
    text-align: center;
    background: rgba(22, 27, 34, .92);
    border: 1px solid #21262d;
    border-radius: 14px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, .45);
  }
  .spinner {
    width: 46px;
    height: 46px;
    margin: 0 auto 22px;
    border-radius: 50%;
    border: 4px solid #1f6feb33;
    border-top-color: #1f6feb;
    animation: spin 1.1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { margin: 0 0 6px; font-size: 18px; font-weight: 600; }
  p { margin: 0 0 24px; font-size: 13px; color: #8b949e; min-height: 18px; }
  .bar {
    position: relative;
    height: 6px;
    border-radius: 4px;
    background: #21262d;
    overflow: hidden;
  }
  .bar span {
    position: absolute;
    inset: 0 auto 0 0;
    width: 0%;
    border-radius: 4px;
    background: linear-gradient(90deg, #1f6feb, #58a6ff);
    transition: width 1.4s ease;
  }
  .pct { margin-top: 10px; font-size: 12px; color: #6e7681; font-variant-numeric: tabular-nums; }
  noscript { display: block; margin-top: 18px; font-size: 12px; color: #d29922; }
</style>
</head>
<body>
  <main class="card" aria-busy="true">
    <div class="spinner" aria-hidden="true"></div>
    <h1>Пожалуйста, подождите</h1>
    <p id="status">Проверка соединения…</p>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="bar">
      <span id="fill"></span>
    </div>
    <div class="pct" id="pct">0%</div>
    <noscript>Для загрузки страницы требуется JavaScript. Включите его и обновите страницу.</noscript>
  </main>
<script>
(function () {
  var fill = document.getElementById('fill');
  var bar = document.getElementById('bar');
  var pct = document.getElementById('pct');
  var status = document.getElementById('status');
  var messages = [
    'Проверка соединения…',
    'Установка защищённого канала…',
    'Загрузка ресурсов…',
    'Проверка браузера…',
    'Пожалуйста, подождите…'
  ];
  var value = 0;
  var i = 0;

  // The progress bar deliberately never completes: it crawls to 99%, then
  // drops back a little and keeps going, so the page loads forever.
  var tick = function () {
    value += Math.random() * 4;
    if (value >= 99) {
      value = 82 + Math.random() * 6;
      i = (i + 1) % messages.length;
      status.textContent = messages[i];
    }
    var shown = Math.floor(value);
    fill.style.width = shown + '%';
    bar.setAttribute('aria-valuenow', String(shown));
    pct.textContent = shown + '%';
    setTimeout(tick, 900 + Math.random() * 1400);
  };

  status.textContent = messages[0];
  setTimeout(tick, 600);
  setTimeout(function () { document.title = 'Загрузка…'; }, 50);

  // Never let a navigation-timeout heuristic "finish" the document.
  window.addEventListener('load', function () {
    setTimeout(function () { document.documentElement.setAttribute('data-loaded', '1'); }, 0);
  });
})();
</script>
</body>
</html>
